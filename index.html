<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sandoug</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sandoug">

    <!-- Google Fonts: Syne (display) + Inter (body) + Reem Kufi (Arabic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600;700&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        /* ═══════════════════════════════════════════
           DESIGN TOKENS
        ═══════════════════════════════════════════ */
        :root {
            /* Palette */
            --bg:          #0a0a0f;
            --surface-1:   #111118;
            --surface-2:   #17171f;
            --surface-3:   #1e1e2a;

            --accent-lime:    #b8ff5b;
            --accent-lime-dim: rgba(184,255,91,0.12);
            --accent-rose:    #ff5b7a;
            --accent-rose-dim: rgba(255,91,122,0.12);
            --accent-sky:     #5bc8ff;
            --accent-sky-dim: rgba(91,200,255,0.10);
            --accent-amber:   #ffbc5b;
            --accent-amber-dim: rgba(255,188,91,0.10);

            --text-1: #f4f4f8;
            --text-2: #8888a0;
            --text-3: #55556a;

            --border:      rgba(255,255,255,0.07);
            --border-glow: rgba(184,255,91,0.25);

            /* Typography */
            --font-display: 'Syne', system-ui, sans-serif;
            --font-body:    'Inter', system-ui, sans-serif;
            --font-arabic:  'Reem Kufi', system-ui, sans-serif;

            /* Motion */
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --dur-fast:  160ms;
            --dur-med:   300ms;
            --dur-slow:  500ms;

            /* Spacing */
            --safe-top:    env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* ═══════════════════════════════════════════
           RESET & BASE
        ═══════════════════════════════════════════ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--bg);
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.55;
            color: var(--text-1);
            background: var(--bg);
            min-height: 100dvh;
            overscroll-behavior: none;
            /* Subtle animated gradient noise */
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(184,255,91,0.06) 0%, transparent 60%);
        }

        /* ═══════════════════════════════════════════
           LAYOUT
        ═══════════════════════════════════════════ */
        .shell {
            max-width: 430px;
            margin: 0 auto;
            padding: 0 0 calc(2rem + var(--safe-bottom)) 0;
        }

        /* ═══════════════════════════════════════════
           TOP BAR (not sticky)
        ═══════════════════════════════════════════ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(var(--safe-top) + 1.1rem) 1.25rem 0.75rem;
        }

        .app-wordmark {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: var(--text-1);
            text-transform: uppercase;
        }

        .app-wordmark span {
            color: var(--accent-lime);
        }

        /* ═══════════════════════════════════════════
           INSTALL CHIP
        ═══════════════════════════════════════════ */
        .install-chip {
            display: none;
            align-items: center;
            gap: 0.4rem;
            background: var(--accent-lime-dim);
            border: 1px solid rgba(184,255,91,0.35);
            color: var(--accent-lime);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.35rem 0.75rem;
            border-radius: 100px;
            cursor: pointer;
            transition: background var(--dur-fast) var(--ease-smooth),
                        transform var(--dur-fast) var(--ease-spring);
            animation: chipIn var(--dur-med) var(--ease-spring) both;
        }
        .install-chip:active { transform: scale(0.94); }
        .install-chip svg { width: 12px; height: 12px; flex-shrink: 0; }

        @keyframes chipIn {
            from { opacity: 0; transform: scale(0.7) translateY(-4px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ═══════════════════════════════════════════
           HERO CARD — STICKY TOTAL
        ═══════════════════════════════════════════ */
        .hero {
            position: sticky;
            top: 0;
            z-index: 50;
            margin: 0 1rem 1.5rem;
            padding: 1.4rem 1.5rem 1.5rem;
            background: var(--surface-1);
            border-radius: 24px;
            border: 1px solid var(--border);
            /* Frosted glass feeling */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            /* Lime glow on top edge */
            box-shadow:
                0 0 0 1px rgba(184,255,91,0.06) inset,
                0 1px 0 0 rgba(184,255,91,0.12) inset,
                0 24px 48px rgba(0,0,0,0.55);
            overflow: hidden;
        }

        /* faint background ring */
        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 120% 100% at 50% 120%, rgba(184,255,91,0.07) 0%, transparent 65%);
            pointer-events: none;
        }

        .hero-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 0.5rem;
        }

        .hero-amount {
            font-family: var(--font-display);
            font-size: clamp(2.6rem, 10vw, 3.2rem);
            font-weight: 800;
            line-height: 1;
            color: var(--accent-lime);
            letter-spacing: -0.02em;
        }

        .hero-amount .hero-currency {
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-2);
            margin-left: 0.3rem;
        }

        .hero-divider {
            height: 1px;
            background: var(--border);
            margin: 1rem 0;
        }

        .hero-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hero-expected-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        .hero-expected-val {
            display: flex;
            align-items: baseline;
            gap: 0.3rem;
        }

        .hero-gap-val {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-rose);
        }

        .hero-gap-label {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        /* Progress bar */
        .progress-track {
            height: 4px;
            background: rgba(255,255,255,0.07);
            border-radius: 100px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 100px;
            background: linear-gradient(90deg, var(--accent-lime), rgba(184,255,91,0.5));
            width: 0%;
            transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .progress-pct {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.4rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-3);
            letter-spacing: 0.06em;
        }

        /* ═══════════════════════════════════════════
           SECTION LABEL
        ═══════════════════════════════════════════ */
        .section-label {
            padding: 0 1.25rem 0.75rem;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        /* ═══════════════════════════════════════════
           MEMBER CARDS
        ═══════════════════════════════════════════ */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 0 1rem;
        }

        .card {
            background: var(--surface-2);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            /* Entrance animation — staggered via JS */
            opacity: 0;
            transform: translateY(18px);
            transition:
                opacity var(--dur-slow) var(--ease-smooth),
                transform var(--dur-slow) var(--ease-smooth),
                border-color var(--dur-fast),
                box-shadow var(--dur-fast);
        }

        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .card:active {
            transform: scale(0.985);
            box-shadow: 0 0 0 2px rgba(184,255,91,0.15);
            border-color: rgba(184,255,91,0.2);
        }

        /* Alert indicator on card left edge */
        .card[data-alert="true"] {
            border-left: 2px solid var(--accent-rose);
        }

        .card[data-alert="false"] {
            border-left: 2px solid var(--accent-lime);
        }

        /* Card Top row */
        .card-top {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 1rem 1.1rem;
        }

        /* Avatar */
        .avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            /* ring color via JS */
            box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 3.5px var(--ring-color, var(--accent-lime));
        }

        .avatar-status {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 2px solid var(--surface-2);
            background: var(--status-color, var(--accent-lime));
        }

        /* Name & months label */
        .card-identity {
            flex: 1;
            min-width: 0;
        }

        .card-name {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .card-sub {
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-3);
            margin-top: 0.2rem;
            letter-spacing: 0.03em;
        }

        /* Card contribution badge */
        .contrib-badge {
            flex-shrink: 0;
            text-align: right;
        }

        .contrib-val {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-1);
            line-height: 1.2;
        }

        .contrib-label {
            font-size: 0.63rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        /* Card stats row */
        .card-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            border-top: 1px solid var(--border);
        }

        .stat-cell {
            padding: 0.65rem 0.6rem;
            text-align: center;
            border-right: 1px solid var(--border);
        }

        .stat-cell:last-child { border-right: none; }

        .stat-cell-label {
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-3);
            margin-bottom: 0.25rem;
        }

        .stat-cell-val {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            line-height: 1;
        }

        .c-lime   { color: var(--accent-lime); }
        .c-rose   { color: var(--accent-rose); }
        .c-sky    { color: var(--accent-sky); }
        .c-amber  { color: var(--accent-amber); }
        .c-muted  { color: var(--text-3); }

        /* ═══════════════════════════════════════════
           LOADER STATE
        ═══════════════════════════════════════════ */
        #loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin: 4rem 1rem 2rem;
            padding: 2.5rem;
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-3);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid rgba(184,255,91,0.15);
            border-top-color: var(--accent-lime);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ═══════════════════════════════════════════
           FOOTER
        ═══════════════════════════════════════════ */
        .app-footer {
            padding: 2rem 1.25rem 0;
            display: flex;
            justify-content: center;
        }

        .sync-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 0.4rem 0.9rem;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-3);
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-lime);
            border-radius: 50%;
            animation: pulse 2.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.7); }
        }

        /* ═══════════════════════════════════════════
           SCROLLBAR (webkit)
        ═══════════════════════════════════════════ */
        ::-webkit-scrollbar { width: 0; }

        /* ═══════════════════════════════════════════
           ARABIC / BILINGUAL STYLES
        ═══════════════════════════════════════════ */

        /* Wordmark — Arabic title */
        .app-wordmark {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
        }
        .app-wordmark .wm-ar {
            font-family: var(--font-arabic);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-1);
            letter-spacing: 0.01em;
            line-height: 1.15;
            direction: rtl;
        }
        .app-wordmark .wm-ar span { color: var(--accent-lime); }
        .app-wordmark .wm-en {
            font-family: var(--font-display);
            font-size: 0.56rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-3);
            line-height: 1;
        }

        /* Hero bilingual label:  عربي · English */
        .bilabel {
            display: flex;
            align-items: baseline;
            gap: 0.35rem;
            flex-wrap: wrap;
        }
        .bilabel .ar {
            font-family: var(--font-arabic);
            font-weight: 600;
            direction: rtl;
            unicode-bidi: embed;
            color: var(--text-2);
        }
        .bilabel .sep {
            color: var(--text-3);
            font-size: 0.6em;
        }

        /* ── Card name: Arabic · English inline, same size & color ── */
        .card-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-1);
            line-height: 1.3;
            /* allow wrap for long bilingual combos */
            white-space: normal;
            overflow: visible;
            text-overflow: unset;
        }
        .card-name .name-ar {
            font-family: var(--font-arabic);
            font-size: 1em;      /* exact same size as English */
            font-weight: 700;
            color: var(--text-1); /* same color as English */
            direction: rtl;
            unicode-bidi: embed;
            letter-spacing: 0;
        }
        .card-name .name-sep {
            color: var(--text-3);
            font-weight: 400;
            margin: 0 0.1em;
        }

        /* Stat-cell bilingual label — stacked, Arabic on top */
        .stat-cell-label .ar-stat {
            display: block;
            font-family: var(--font-arabic);
            font-size: 0.64rem;
            font-weight: 600;
            color: var(--text-2);
            letter-spacing: 0;
            direction: rtl;
            unicode-bidi: embed;
            text-transform: none;
            margin-bottom: 0.08rem;
        }

        /* Contrib badge Arabic */
        .ar-contrib {
            display: block;
            font-family: var(--font-arabic);
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-2);
            direction: rtl;
            unicode-bidi: embed;
            text-transform: none;
            letter-spacing: 0;
        }
    </style>
</head>
<body>
    <div class="shell">

        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="app-wordmark">
                <div class="wm-ar">صندوق <span>أهل الطيب</span></div>
                <div class="wm-en">Sandoug</div>
            </div>
            <button id="install-btn" class="install-chip">
                <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 1v7M3 5l3 3 3-3M1 10h10"/>
                </svg>
                Install
            </button>
        </div>

        <!-- HERO TOTAL -->
        <div class="hero" id="hero">
            <div class="hero-label bilabel">
                <span class="ar">المجموع</span><span class="sep">·</span>Total Pot
            </div>
            <div class="hero-amount" id="total-amount">
                <span id="total-val">—</span><span class="hero-currency"><span class="bilabel" style="font-size:0.85em;display:inline-flex;vertical-align:baseline"><span class="ar" style="font-size:1em">درهم</span><span class="sep">·</span>MAD</span></span>
            </div>

            <div class="hero-divider"></div>

            <div class="hero-meta">
                <div>
                    <div class="hero-expected-label bilabel">
                        <span class="ar">المنشود</span><span class="sep">·</span>Expected
                    </div>
                    <div class="hero-expected-val">
                        <span id="expected-val" class="hero-gap-val">—</span>
                        <span class="hero-currency" style="font-size:0.75rem;color:var(--text-3)">درهم · MAD</span>
                    </div>
                </div>
                <div style="text-align:right;">
                    <div class="hero-gap-label bilabel" style="justify-content:flex-end">
                        <span class="ar">الفجوة</span><span class="sep">·</span>Gap
                    </div>
                    <div id="gap-val" class="hero-gap-val">—</div>
                </div>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-pct" id="progress-pct">—%</div>
        </div>

        <!-- LOADER -->
        <div id="loader">
            <div class="spinner"></div>
            Syncing data
        </div>

        <!-- MEMBERS -->
        <div class="section-label" id="members-label" style="display:none">Members</div>
        <div class="grid" id="user-grid"></div>

        <!-- FOOTER -->
        <div class="app-footer" id="app-footer" style="display:none">
            <div class="sync-badge">
                <div class="sync-dot"></div>
                Live data
            </div>
        </div>

    </div><!-- /shell -->

    <script>
        /* ─── Install prompt ─── */
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        // Detect running contexts
        const isIOS        = /iphone|ipad|ipod/i.test(navigator.userAgent);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                          || window.navigator.standalone === true;

        // Already installed as PWA — hide button entirely
        if (isStandalone) {
            installBtn.style.display = 'none';
        }
        // iOS Safari — beforeinstallprompt never fires; show manual hint
        else if (isIOS) {
            installBtn.style.display = 'inline-flex';
            installBtn.querySelector('svg').style.display = 'none';
            installBtn.childNodes[installBtn.childNodes.length - 1].textContent = '+ Add to Home';
            installBtn.addEventListener('click', () => {
                // Show a brief toast-style iOS instruction
                const toast = document.createElement('div');
                toast.style.cssText = `
                    position:fixed;bottom:calc(2rem + env(safe-area-inset-bottom));
                    left:50%;transform:translateX(-50%);
                    background:var(--surface-3);border:1px solid var(--border);
                    border-radius:14px;padding:0.9rem 1.2rem;
                    font-family:var(--font-body);font-size:0.78rem;font-weight:500;
                    color:var(--text-1);line-height:1.5;text-align:center;
                    box-shadow:0 8px 32px rgba(0,0,0,0.6);
                    z-index:9999;max-width:280px;width:90%;
                    animation:chipIn 0.3s var(--ease-spring) both;
                `;
                toast.innerHTML = `Tap <strong>Share</strong> <span style="font-size:1.1em">⎋</span> then<br><strong>"Add to Home Screen"</strong> 📲`;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            });
        }

        // Android / Chrome / Edge — standard beforeinstallprompt
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            deferredPrompt = e;
            if (!isStandalone) installBtn.style.display = 'inline-flex';
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') installBtn.style.display = 'none';
            deferredPrompt = null;
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            deferredPrompt = null;
        });

        /* ─── Service Worker ─── */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () =>
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('SW registered'))
                    .catch(err => console.warn('SW failed:', err))
            );
        }

        /* ─── Animated number counter ─── */
        function animateNumber(el, target, duration = 900) {
            const start = performance.now();
            const from = 0;
            const step = ts => {
                const p = Math.min((ts - start) / duration, 1);
                // ease-out-expo
                const eased = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
                el.textContent = Math.round(from + (target - from) * eased).toLocaleString();
                if (p < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        }

        /* ─── App init ─── */
        async function initApp() {
            const loader  = document.getElementById('loader');

            if (typeof Papa === 'undefined') {
                loader.innerHTML = '<div class="spinner" style="border-top-color:var(--accent-rose)"></div>System resources missing.';
                return;
            }

            try {
                const csvUrl  = 'SANDOUG.csv?v=' + Date.now();
                const resp    = await fetch(csvUrl, { cache: 'no-store' });
                if (!resp.ok) throw new Error('Network response was not OK.');
                const csvText = await resp.text();

                if (csvText.trim().startsWith('<!DOCTYPE') || csvText.trim().startsWith('<html')) {
                    throw new Error('GitHub is deploying. Please refresh in 1 minute.');
                }

                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete({ data }) {
                        if (!data.length) { loader.innerHTML = 'CSV is empty.'; return; }
                        processData(data);
                        loader.style.display = 'none';
                        document.getElementById('members-label').style.display = '';
                        document.getElementById('app-footer').style.display = '';
                    }
                });

            } catch (err) {
                let msg = 'Network error. Close &amp; reopen the app.';
                if (location.protocol === 'file:') {
                    msg = 'Open via a local server, not file://.<br><small style="opacity:.6">Run: npx serve .</small>';
                } else if (err.message.includes('deploying')) {
                    msg = err.message;
                }
                loader.innerHTML = `<div style="color:var(--accent-rose);font-size:1.5rem">⚠</div><span style="text-align:center;line-height:1.6">${msg}</span>`;
            }
        }

        function processData(data) {
            let totalPot      = 0;
            let totalExpected = 0;
            const grid        = document.getElementById('user-grid');
            grid.innerHTML    = '';
            const now         = new Date();

            /* ── Arabic name lookup (keyed by lowercase trimmed English name) ── */
            const AR_NAMES = {
                'tayeb':        'الوالد الطيب',
                'moulay ahmed': 'م أحمد',
                "m'barek":      'مبارك',
                'ali':          'عالي',
                'aadnane':      'عدنان',
                'mohamed':      'محمد',
                'omar':         'عمار',
                'brahim':       'إبراهيم',
                'hamza':        'حمزة',
                'el yazid':     'اليزيد',
            };

            data.forEach((row, idx) => {
                const memberId       = (row['Member ID']        || '').trim();
                const name           = (row['Member Name']      || '').trim();
                const initialShare   = parseFloat(row['Initial share (mad)'])          || 0;
                const monthlyShare   = parseFloat(row['monthly share (mad)'])          || 0;
                const paidMonths     = parseInt(row['number of paid months'])          || 0;
                const borrowed       = parseFloat(row['borrowed amount'])              || 0;
                const returned       = parseFloat(row['returned amount'])              || 0;
                const startStr       = (row['Starting month'] || '').trim();

                if (!name) return;

                /* ── Pot contributions ── */
                const contributed = initialShare + monthlyShare * paidMonths;
                totalPot += contributed - borrowed + returned;

                /* ── Expected months ── */
                let expMonths = 0;
                if (startStr) {
                    let sy = 0, sm = 0;
                    if (startStr.includes('/')) {
                        const p = startStr.split('/');
                        if (p.length === 2) { sm = +p[0] - 1; sy = +p[1]; }
                        else                { sm = +p[1] - 1; sy = +p[2]; }
                    } else if (startStr.includes('-')) {
                        const p = startStr.split('-');
                        sy = +p[0]; sm = +p[1] - 1;
                    }
                    if (!isNaN(sy) && !isNaN(sm)) {
                        expMonths = (now.getFullYear() - sy) * 12 + (now.getMonth() - sm);
                        const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                        if (now.getDate() === lastDay) expMonths += 1;
                        if (expMonths < 0) expMonths = 0;
                    }
                }

                const userExpected = initialShare + monthlyShare * expMonths;
                totalExpected += userExpected - borrowed + returned;

                const lacked = Math.max(0, expMonths - paidMonths);
                const isAlert = lacked > 0;

                /* ── Arabic name ── */
                const arName = AR_NAMES[name.trim().toLowerCase()] || '';

                /* ── Build card ── */
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.alert = isAlert;

                /* Avatar */
                const ringColor   = isAlert ? 'var(--accent-rose)' : 'var(--accent-lime)';
                const statusColor = isAlert ? 'var(--accent-rose)' : 'var(--accent-lime)';

                card.innerHTML = `
                    <div class="card-top">
                        <div class="avatar-wrap">
                            <img
                                class="avatar"
                                src="images/${memberId}.jpg"
                                alt="${name}"
                                style="--ring-color:${ringColor}"
                                onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1e1e2a&color=f4f4f8&size=128&bold=true'"
                            >
                            <div class="avatar-status" style="--status-color:${statusColor}"></div>
                        </div>
                        <div class="card-identity">
                            <div class="card-name">${arName ? `<span class="name-ar">${arName}</span><span class="name-sep"> · </span>` : ''}${name}</div>
                            <div class="card-sub">${monthlyShare.toLocaleString()} درهم · MAD / month</div>
                        </div>
                        <div class="contrib-badge">
                            <div class="contrib-val">${contributed.toLocaleString()}</div>
                            <div class="contrib-label">
                                <span class="ar-contrib">أدى</span>
                                Paid in
                            </div>
                        </div>
                    </div>
                    <div class="card-stats">
                        <div class="stat-cell">
                            <div class="stat-cell-label"><span class="ar-stat">الشهور المدفوعة</span>Paid</div>
                            <div class="stat-cell-val c-lime">${paidMonths}</div>
                        </div>
                        <div class="stat-cell">
                            <div class="stat-cell-label"><span class="ar-stat">الشهور الناقصة</span>Lacked</div>
                            <div class="stat-cell-val ${lacked > 0 ? 'c-rose' : 'c-muted'}">${lacked}</div>
                        </div>
                        <div class="stat-cell">
                            <div class="stat-cell-label"><span class="ar-stat">استدان</span>Borrow</div>
                            <div class="stat-cell-val ${borrowed > 0 ? 'c-amber' : 'c-muted'}">${borrowed > 0 ? borrowed.toLocaleString() : '—'}</div>
                        </div>
                        <div class="stat-cell">
                            <div class="stat-cell-label"><span class="ar-stat">أعاد</span>Return</div>
                            <div class="stat-cell-val ${returned > 0 ? 'c-sky' : 'c-muted'}">${returned > 0 ? returned.toLocaleString() : '—'}</div>
                        </div>
                    </div>
                `;

                grid.appendChild(card);

                /* Staggered entrance */
                setTimeout(() => card.classList.add('visible'), 80 + idx * 70);
            });

            /* ── Update hero ── */
            const totalValEl    = document.getElementById('total-val');
            const expectedValEl = document.getElementById('expected-val');
            const gapValEl      = document.getElementById('gap-val');
            const progressFill  = document.getElementById('progress-fill');
            const progressPct   = document.getElementById('progress-pct');

            const gap = totalExpected - totalPot;
            const pct = totalExpected > 0 ? Math.min(100, (totalPot / totalExpected) * 100) : 0;

            animateNumber(totalValEl,    totalPot,       900);
            animateNumber(expectedValEl, totalExpected, 1050);

            gapValEl.textContent = (gap > 0 ? '-' : '') + Math.abs(gap).toLocaleString();
            gapValEl.style.color = gap > 0 ? 'var(--accent-rose)' : 'var(--accent-lime)';

            setTimeout(() => {
                progressFill.style.width = pct + '%';
                progressPct.textContent  = pct.toFixed(1) + '%';
            }, 200);
        }

        initApp();
    </script>
</body>
</html>
