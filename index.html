<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport meta tag is crucial for mobile scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA Requirements -->
    <title>Sandoug</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sandoug">

    <script src="[https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js](https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js)"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #4caf50;
            --alert: #f44336;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Prevent text selection on mobile for app-like feel */
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            /* Extra padding at bottom for mobile scrolling */
            padding: 1rem 1rem 3rem 1rem; 
        }

        .container {
            max-width: 600px; /* Constrained for mobile/tablet */
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1.5rem 0;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        header h1 {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total-sum {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.1;
        }

        .currency {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .grid {
            display: grid;
            /* Single column on phones, two on slightly larger screens */
            grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            gap: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            margin-right: 1rem;
        }

        .member-name {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .stats-container {
            display: flex;
            gap: 0.5rem;
        }

        .stats {
            flex: 1;
            background-color: var(--bg-color);
            padding: 0.75rem;
            border-radius: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .paid { color: var(--accent); }
        .lacked { color: var(--alert); }
        .zero-lacked { color: var(--text-secondary); }

        #loader {
            text-align: center;
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Total Savings</h1>
            <div class="total-sum" id="total-amount">...<span class="currency"> MAD</span></div>
        </header>

        <div id="loader">Syncing data...</div>
        <div class="grid" id="user-grid"></div>
    </div>

    <script>
        // --- 1. Register Service Worker for PWA functionality ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('ServiceWorker registered'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }

        // --- 2. Load and Process Data ---
        document.addEventListener('DOMContentLoaded', () => {
            // Timestamp prevents aggressive mobile caching of the CSV
            const csvUrl = 'SANDOUG.csv?v=' + new Date().getTime();

            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    document.getElementById('loader').style.display = 'none';
                    processData(results.data);
                },
                error: function(err) {
                    document.getElementById('loader').innerText = "Offline or Error loading data.";
                    console.error("Error loading CSV:", err);
                }
            });
        });

        function processData(data) {
            let totalPot = 0;
            const grid = document.getElementById('user-grid');
            const currentDate = new Date(); 

            data.forEach(row => {
                const memberId = row['Member ID'] ? row['Member ID'].trim() : '';
                const name = row['Member Name'] ? row['Member Name'].trim() : 'Unknown';
                const initialShare = parseFloat(row['Initial share (mad)']) || 0;
                const monthlyShare = parseFloat(row['monthly share (mad)']) || 0;
                const paidMonths = parseInt(row['number of paid months']) || 0;
                const startingMonthStr = row['Starting month'];

                // Tally total
                const userTotalContributed = initialShare + (monthlyShare * paidMonths);
                totalPot += userTotalContributed;

                // Calculate lacked months
                let lackedMonths = 0;
                if (startingMonthStr) {
                    const startDate = new Date(startingMonthStr);
                    const expectedMonths = (currentDate.getFullYear() - startDate.getFullYear()) * 12 + (currentDate.getMonth() - startDate.getMonth()) + 1;
                    lackedMonths = Math.max(0, expectedMonths - paidMonths);
                }

                // Create Card (Optimized for Mobile UI)
                const card = document.createElement('div');
                card.className = 'card';

                const cardHeader = document.createElement('div');
                cardHeader.className = 'card-header';

                const img = document.createElement('img');
                img.className = 'avatar';
                img.src = `images/${memberId}.jpg`;
                img.alt = name;
                img.onerror = function() {
                    this.src = `[https://ui-avatars.com/api/?name=$](https://ui-avatars.com/api/?name=$){encodeURIComponent(name)}&background=333&color=fff&size=150`;
                };

                const nameEl = document.createElement('div');
                nameEl.className = 'member-name';
                nameEl.innerText = name;

                cardHeader.appendChild(img);
                cardHeader.appendChild(nameEl);

                const statsContainer = document.createElement('div');
                statsContainer.className = 'stats-container';

                const statsPaid = document.createElement('div');
                statsPaid.className = 'stats';
                statsPaid.innerHTML = `
                    <span class="stat-label">Paid</span>
                    <span class="stat-value paid">${paidMonths}</span>
                `;

                const statsLacked = document.createElement('div');
                statsLacked.className = 'stats';
                const lackedClass = lackedMonths > 0 ? 'lacked' : 'zero-lacked';
                statsLacked.innerHTML = `
                    <span class="stat-label">Lacks</span>
                    <span class="stat-value ${lackedClass}">${lackedMonths}</span>
                `;

                statsContainer.appendChild(statsPaid);
                statsContainer.appendChild(statsLacked);

                card.appendChild(cardHeader);
                card.appendChild(statsContainer);
                
                grid.appendChild(card);
            });

            document.getElementById('total-amount').innerHTML = `${totalPot.toLocaleString()} <span class="currency">MAD</span>`;
        }
    </script>
</body>
</html>
