<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Sandoug Dashboard</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #4caf50;
            --alert: #f44336;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 1rem; /* Reduced for mobile */
            padding-top: env(safe-area-inset-top, 1rem); /* iPhone notch support */
        }

        .container {
            max-width: 600px; /* Constrained for mobile focus */
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .total-sum {
            font-size: 3rem; /* Scaled down for mobile */
            font-weight: 800;
            color: var(--accent);
        }

        .currency {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: normal;
        }

        /* 1 column on phones, 2 columns on small tablets */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 480px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px; /* Softer corners for mobile */
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 0.75rem;
            border: 2px solid var(--border);
        }

        .member-name {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            font-weight: 600;
            text-align: center;
        }

        .stats-container {
            width: 100%;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: bold;
        }

        .paid { color: var(--accent); }
        .lacked { color: var(--alert); }
        .zero-lacked { color: var(--text-secondary); }

        #loader {
            text-align: center;
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Total Savings</h1>
            <div class="total-sum" id="total-amount">...<span class="currency"> MAD</span></div>
        </header>

        <div id="loader">Syncing data...</div>
        <div class="grid" id="user-grid"></div>
    </div>

    <script>
        // Register the Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.log('Service Worker Failed', err));
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Append timestamp to bypass caching of the CSV
            const csvUrl = 'SANDOUG.csv?v=' + new Date().getTime();

            Papa.parse(csvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    document.getElementById('loader').style.display = 'none';
                    processData(results.data);
                },
                error: function(err) {
                    document.getElementById('loader').innerText = "Network error. Showing cached data if available.";
                    console.error("Error loading CSV:", err);
                }
            });
        });

        function processData(data) {
            let totalPot = 0;
            const grid = document.getElementById('user-grid');
            grid.innerHTML = ''; // Clear existing content
            
            const currentDate = new Date(); 

            data.forEach(row => {
                const memberId = row['Member ID'] ? row['Member ID'].trim() : '';
                const name = row['Member Name'] ? row['Member Name'].trim() : 'Unknown';
                const initialShare = parseFloat(row['Initial share (mad)']) || 0;
                const monthlyShare = parseFloat(row['monthly share (mad)']) || 0;
                const paidMonths = parseInt(row['number of paid months']) || 0;
                const startingMonthStr = row['Starting month'];

                totalPot += initialShare + (monthlyShare * paidMonths);

                let lackedMonths = 0;
                if (startingMonthStr) {
                    const startDate = new Date(startingMonthStr);
                    const expectedMonths = (currentDate.getFullYear() - startDate.getFullYear()) * 12 + (currentDate.getMonth() - startDate.getMonth()) + 1;
                    lackedMonths = Math.max(0, expectedMonths - paidMonths);
                }

                const card = document.createElement('div');
                card.className = 'card';

                const img = document.createElement('img');
                img.className = 'avatar';
                img.src = `images/${memberId}.jpg`;
                img.alt = `${name}`;
                img.onerror = function() {
                    this.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=333&color=fff&size=150`;
                };

                const nameEl = document.createElement('div');
                nameEl.className = 'member-name';
                nameEl.innerText = name;

                const statsContainer = document.createElement('div');
                statsContainer.className = 'stats-container';

                const statsPaid = document.createElement('div');
                statsPaid.className = 'stats';
                statsPaid.innerHTML = `<span class="stat-label">Months Paid</span><span class="stat-value paid">${paidMonths}</span>`;

                const statsLacked = document.createElement('div');
                statsLacked.className = 'stats';
                const lackedClass = lackedMonths > 0 ? 'lacked' : 'zero-lacked';
                statsLacked.innerHTML = `<span class="stat-label">Months Lacked</span><span class="stat-value ${lackedClass}">${lackedMonths}</span>`;

                statsContainer.appendChild(statsPaid);
                statsContainer.appendChild(statsLacked);

                card.appendChild(img);
                card.appendChild(nameEl);
                card.appendChild(statsContainer);
                
                grid.appendChild(card);
            });

            document.getElementById('total-amount').innerHTML = `${totalPot.toLocaleString()} <span class="currency">MAD</span>`;
        }
    </script>
</body>
</html>
