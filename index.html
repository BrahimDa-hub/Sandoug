<script>
        // 1. Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('ServiceWorker registered'))
                    .catch(err => console.log('ServiceWorker failed: ', err));
            });
        }

        // 2. Modern Fetch & Parse
        async function initApp() {
            const loader = document.getElementById('loader');
            
            if (typeof Papa === 'undefined') {
                loader.innerText = "Error: System resources missing.";
                return;
            }

            try {
                // Force a network request for the latest CSV
                const csvUrl = 'SANDOUG.csv?v=' + new Date().getTime();
                
                // Use modern fetch() instead of PapaParse's built-in XHR
                const response = await fetch(csvUrl, { cache: 'no-store' });
                
                if (!response.ok) {
                    throw new Error("Network response was not OK.");
                }
                
                const csvText = await response.text();
                
                // Protect against GitHub Pages deployment HTML pages
                if (csvText.trim().startsWith('<!DOCTYPE') || csvText.trim().startsWith('<html')) {
                    throw new Error("GitHub is deploying updates. Please refresh in 1 minute.");
                }

                // Parse the raw text
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        try {
                            processData(results.data);
                            loader.style.display = 'none';
                        } catch (error) {
                            loader.innerText = "Data error: Check CSV columns.";
                            console.error(error);
                        }
                    }
                });
                
            } catch (error) {
                // Display the exact error so it never hangs blindly
                loader.innerText = error.message.includes("deploying") 
                    ? error.message 
                    : "Network error. Close and reopen the app to try again.";
                console.error("Fetch Error:", error);
            }
        }

        function processData(data) {
            let totalPot = 0;
            const grid = document.getElementById('user-grid');
            grid.innerHTML = ''; // Clear grid before populating
            const currentDate = new Date(); 

            data.forEach(row => {
                const memberId = row['Member ID'] ? row['Member ID'].trim() : '';
                const name = row['Member Name'] ? row['Member Name'].trim() : 'Unknown';
                const initialShare = parseFloat(row['Initial share (mad)']) || 0;
                const monthlyShare = parseFloat(row['monthly share (mad)']) || 0;
                const paidMonths = parseInt(row['number of paid months']) || 0;
                const startingMonthStr = row['Starting month'];

                const userTotalContributed = initialShare + (monthlyShare * paidMonths);
                totalPot += userTotalContributed;

                let lackedMonths = 0;
                if (startingMonthStr) {
                    const startDate = new Date(startingMonthStr);
                    const expectedMonths = (currentDate.getFullYear() - startDate.getFullYear()) * 12 + (currentDate.getMonth() - startDate.getMonth()) + 1;
                    lackedMonths = Math.max(0, expectedMonths - paidMonths);
                }

                const card = document.createElement('div');
                card.className = 'card';

                const cardHeader = document.createElement('div');
                cardHeader.className = 'card-header';

                const img = document.createElement('img');
                img.className = 'avatar';
                img.src = `images/${memberId}.jpg`;
                img.alt = name;
                img.onerror = function() {
                    this.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=333&color=fff&size=150`;
                };

                const nameEl = document.createElement('div');
                nameEl.className = 'member-name';
                nameEl.innerText = name;

                cardHeader.appendChild(img);
                cardHeader.appendChild(nameEl);

                const statsContainer = document.createElement('div');
                statsContainer.className = 'stats-container';

                const statsPaid = document.createElement('div');
                statsPaid.className = 'stats';
                statsPaid.innerHTML = `
                    <span class="stat-label">Paid</span>
                    <span class="stat-value paid">${paidMonths}</span>
                `;

                const statsLacked = document.createElement('div');
                statsLacked.className = 'stats';
                const lackedClass = lackedMonths > 0 ? 'lacked' : 'zero-lacked';
                statsLacked.innerHTML = `
                    <span class="stat-label">Lacks</span>
                    <span class="stat-value ${lackedClass}">${lackedMonths}</span>
                `;

                statsContainer.appendChild(statsPaid);
                statsContainer.appendChild(statsLacked);

                card.appendChild(cardHeader);
                card.appendChild(statsContainer);
                
                grid.appendChild(card);
            });

            document.getElementById('total-amount').innerHTML = `${totalPot.toLocaleString()} <span class="currency">MAD</span>`;
        }

        // Fire initialization directly
        initApp();
    </script>
